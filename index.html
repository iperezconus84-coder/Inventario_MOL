<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVENTARIO DE PROCESOS</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px; 
            background-color: #000000; 
            color: #00ff66; 
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: #000000; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid #00ff66;
            box-shadow: 0 4px 10px rgba(0, 255, 102, 0.2);
            flex: 1;
            box-sizing: border-box;
            width: 100%;
        }
        h1 { 
            text-align: center; 
            color: #00ff66; 
            font-size: 1.5em; 
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        label { 
            font-weight: bold; 
            margin-top: 15px; 
            display: block; 
            color: #00ff66; 
        }
        select, input { 
            width: 100%; 
            padding: 12px; 
            margin: 5px 0 15px 0; 
            box-sizing: border-box; 
            font-size: 1em; 
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #00ff66;
            border-radius: 4px;
        }
        select:focus, input:focus {
            outline: none;
            box-shadow: 0 0 5px #00ff66;
        }
        .progress { 
            font-size: 1.8em; 
            font-weight: bold; 
            text-align: center; 
            margin: 15px 0; 
            color: #00ff66; 
            background: #001a0a; 
            border: 1px solid #00ff66;
            padding: 12px; 
            border-radius: 4px; 
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background-color: rgba(0, 255, 102, 0.3); 
            color: #ffffff; 
            border: 1px solid #00ff66; 
            border-radius: 4px; 
            font-size: 1em; 
            font-weight: bold;
            cursor: pointer; 
            margin-top: 10px; 
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: rgba(0, 255, 102, 0.6);
        }
        button.secondary { 
            background-color: rgba(0, 0, 0, 0.5); 
            border: 1px solid #00ff66;
        }
        button.secondary:hover {
            background-color: rgba(0, 255, 102, 0.2);
        }
        button.demo { 
            background-color: rgba(0, 150, 60, 0.4); 
        }
        button.warning {
            background-color: rgba(180, 100, 0, 0.4);
            border: 1px solid #ffaa00;
            color: #ffaa00;
        }
        button.warning:hover {
            background-color: rgba(180, 100, 0, 0.7);
        }
        .file-section { 
            background: #000d05; 
            padding: 15px; 
            border-radius: 4px; 
            margin-bottom: 20px; 
            border: 1px solid #00ff66; 
        }
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 10; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.8); 
        }
        .modal-content { 
            background-color: #ffffff; 
            color: #000000;
            margin: 15% auto; 
            padding: 25px; 
            width: 80%; 
            max-width: 400px; 
            border-radius: 8px; 
            text-align: center; 
            border: 2px solid #00ff66;
        }
        .modal-content button { 
            margin-top: 15px; 
            color: #ffffff;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #00ff66;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-top: 1px solid #001a0a;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WMS Inventario Pro</h1>
        
        <div class="file-section">
            <label>Cargar Archivo Excel CSV (stock_tmt1.csv):</label>
            <input type="file" id="fileStock" accept=".csv">
            
            <label>Cargar Archivo Excel CSV (plano_tmt1.csv):</label>
            <input type="file" id="filePlano" accept=".csv">

            <button class="demo" onclick="cargarDatosPrueba()">Cargar Datos de Prueba Automaticos</button>
        </div>

        <label>Bodega:</label>
        <select id="bodegaSelect" onchange="actualizarCalles()">
            <option value="">Seleccione Bodega...</option>
        </select>

        <label>Calle:</label>
        <select id="calleSelect" onchange="configurarCalle()">
            <option value="">Seleccione Calle...</option>
        </select>

        <label>Meta de Lotes (Editable):</label>
        <input type="number" id="metaLotes" value="300" oninput="actualizarProgresoVisual()">

        <div class="progress" id="displayProgress">0 / 300</div>

        <input type="text" id="scannerInput" placeholder="Escanear Lote..." autofocus>
        
        <button id="btnCerrarCalle" onclick="cerrarCalle()">Cerrar Calle y Guardar</button>
        <button id="btnReabrirCalle" class="warning" onclick="reabrirCalle()" style="display:none;">Reabrir Calle Actual</button>
        <button class="secondary" onclick="descargarCSVGlobal()">Descargar Consolidado Final</button>
    </div>

    <footer>
        Renovables para una vida mejor
    </footer>

    <!-- Modal para Alertas -->
    <div id="alertModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Atencion</h3>
            <p id="modalMessage">Mensaje de alerta</p>
            <button id="modalBtnAceptar" onclick="resolverModal(true)" style="background-color: rgba(0, 200, 100, 0.9);">Aceptar / Continuar</button>
            <button id="modalBtnCancelar" onclick="resolverModal(false)" style="background-color: rgba(200, 50, 50, 0.9);">Cancelar</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        let datosPlano = [];
        let datosStock = [];
        let capturasGlobales = [];
        let capturasCalleActual = [];
        let contadorActual = 0;
        let callbackModal = null;
        let calleCerradaGuardada = false;

        function emitirPitido() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch (e) {
                // Se ignora silenciosamente
            }
        }

        const parseConfig = {
            header: true,
            skipEmptyLines: true,
            dynamicTyping: true,
            delimiter: "", 
            encoding: "ISO-8859-1"
        };

        document.getElementById('filePlano').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if(!file) return;
            Papa.parse(file, {
                ...parseConfig,
                complete: function(results) { 
                    datosPlano = results.data; 
                    cargarBodegas(); 
                    alert('Archivo plano cargado correctamente'); 
                }
            });
        });

        document.getElementById('fileStock').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if(!file) return;
            Papa.parse(file, {
                ...parseConfig,
                complete: function(results) { 
                    datosStock = results.data; 
                    alert('Archivo de stock cargado correctamente'); 
                }
            });
        });

        function cargarDatosPrueba() {
            datosPlano = [
                { bodega: "Bodega_Norte", calle: "Calle_A1", cantidad_lotes: 3 },
                { bodega: "Bodega_Norte", calle: "Calle_A2", cantidad_lotes: 2 },
                { bodega: "Bodega_Sur", calle: "Calle_B1", cantidad_lotes: 2 }
            ];

            datosStock = [
                { lote: "LOTE-101", SKU: "SKU-ALPHA", descripción: "Producto A - Tornillos", piezas: 100, volumen: 1.2 },
                { lote: "LOTE-102", SKU: "SKU-ALPHA", descripción: "Producto A - Tornillos", piezas: 150, volumen: 1.5 },
                { lote: "LOTE-103", SKU: "SKU-BETA", descripción: "Producto B - Tuercas", piezas: 200, volumen: 0.8 },
                { lote: "LOTE-104", SKU: "SKU-BETA", descripción: "Producto B - Tuercas", piezas: 120, volumen: 0.5 },
                { lote: "LOTE-105", SKU: "SKU-GAMMA", descripción: "Producto C - Arandelas", piezas: 300, volumen: 0.3 },
                { lote: "LOTE-106", SKU: "SKU-GAMMA", descripción: "Producto C - Arandelas", piezas: 250, volumen: 0.2 },
                { lote: "LOTE-107", SKU: "SKU-DELTA", descripción: "Producto D - Pernos", piezas: 80, volumen: 2.1 }
            ];

            cargarBodegas();
            alert("Datos de prueba cargados con exito. Seleccione Bodega y Calle.");
        }

        function cargarBodegas() {
            const bodegaSelect = document.getElementById('bodegaSelect');
            bodegaSelect.innerHTML = '<option value="">Seleccione Bodega...</option>';
            const bodegas = [...new Set(datosPlano.map(row => row.bodega || row.Bodega || row.BODEGA))];
            bodegas.forEach(b => { if (b) bodegaSelect.innerHTML += `<option value="${b}">${b}</option>`; });
        }

        function actualizarCalles() {
            const bodega = document.getElementById('bodegaSelect').value;
            const calleSelect = document.getElementById('calleSelect');
            calleSelect.innerHTML = '<option value="">Seleccione Calle...</option>';
            if (!bodega) return;
            const calles = datosPlano.filter(row => (row.bodega || row.Bodega || row.BODEGA) == bodega);
            calles.forEach(c => {
                let nombreCalle = c.calle || c.Calle || c.CALLE;
                if (nombreCalle) calleSelect.innerHTML += `<option value="${nombreCalle}">${nombreCalle}</option>`;
            });
            calleCerradaGuardada = false;
            actualizarBotonesAccion();
        }

        function configurarCalle() {
            const bodega = document.getElementById('bodegaSelect').value;
            const calleSelect = document.getElementById('calleSelect').value;
            
            let capturasPrevias = capturasGlobales.filter(c => c.bodega == bodega && c.calle == calleSelect);
            if (capturasPrevias.length > 0) {
                capturasCalleActual = [...capturasPrevias];
                contadorActual = capturasCalleActual.length;
                calleCerradaGuardada = true;
            } else {
                contadorActual = 0;
                capturasCalleActual = [];
                calleCerradaGuardada = false;
            }

            if (bodega && calleSelect) {
                let registroPlano = datosPlano.find(row => 
                    (row.bodega || row.Bodega || row.BODEGA) == bodega && 
                    (row.calle || row.Calle || row.CALLE) == calleSelect
                );
                if (registroPlano) {
                    let cantidadPlano = registroPlano.cantidad_lotes || registroPlano.Cantidad_Lotes || registroPlano.CANTIDAD_LOTES || 300;
                    document.getElementById('metaLotes').value = cantidadPlano;
                }
            }
            actualizarProgresoVisual();
            actualizarBotonesAccion();
        }

        function actualizarProgresoVisual() {
            let meta = document.getElementById('metaLotes').value;
            document.getElementById('displayProgress').innerText = `${contadorActual} / ${meta}`;
        }

        function actualizarBotonesAccion() {
            let btnCerrar = document.getElementById('btnCerrarCalle');
            let btnReabrir = document.getElementById('btnReabrirCalle');
            let inputScanner = document.getElementById('scannerInput');

            if (calleCerradaGuardada) {
                btnCerrar.style.display = 'none';
                btnReabrir.style.display = 'block';
                inputScanner.disabled = true;
                inputScanner.placeholder = "Calle cerrada. Pulse Reabrir para modificar.";
            } else {
                btnCerrar.style.display = 'block';
                btnReabrir.style.display = 'none';
                inputScanner.disabled = false;
                inputScanner.placeholder = "Escanear Lote...";
            }
        }

        document.getElementById('scannerInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                let bodega = document.getElementById('bodegaSelect').value;
                let calle = document.getElementById('calleSelect').value;
                let lote = String(this.value).trim();
                this.value = '';

                if (!bodega || !calle) {
                    alert('Seleccione Bodega y Calle primero.');
                    return;
                }
                if (lote === '') return;

                procesarLoteEscaneado(bodega, calle, lote);
            }
        });

        function procesarLoteEscaneado(bodega, calle, lote) {
            let yaCapturadoCalle = capturasCalleActual.find(c => c.lote == lote);
            if (yaCapturadoCalle) {
                mostrarModal("Lote Duplicado (Calle Actual)", `El lote ${lote} ya fue escaneado en esta misma calle. Desea registrarlo nuevamente?`, function(confirmado) {
                    if (confirmado) registrarCaptura(bodega, calle, lote, "DUPLICADO_CALLE_CONFIRMADO");
                });
                return;
            }

            let yaCapturadoOtraCalle = capturasGlobales.find(c => c.lote == lote && c.calle != calle);
            if (yaCapturadoOtraCalle) {
                mostrarModal("Lote Duplicado (Otra Calle)", `El lote ${lote} ya fue registrado previamente en la calle ${yaCapturadoOtraCalle.calle}. Desea registrarlo aqui de todas formas?`, function(confirmado) {
                    if (confirmado) {
                        verificarStockYLuegoRegistrar(bodega, calle, lote, "DUPLICADO_OTRA_CALLE_CONFIRMADO");
                    }
                });
                return;
            }

            verificarStockYLuegoRegistrar(bodega, calle, lote, "NORMAL");
        }

        function verificarStockYLuegoRegistrar(bodega, calle, lote, estadoInicial) {
            let infoStock = datosStock.find(row => String(row.lote || row.Lote || row.LOTE) == lote);
            if (!infoStock && datosStock.length > 0) {
                mostrarModal("Lote No Encontrado (Sobrante)", `El lote ${lote} no esta en el stock logico. Se agregara como sobrante/manual.`, function(confirmado) {
                    if (confirmado) registrarCaptura(bodega, calle, lote, estadoInicial === "NORMAL" ? "MANUAL_SOBRANTE" : estadoInicial, {});
                });
                return;
            }

            let datosExtra = infoStock ? {
                sku: infoStock.sku || infoStock.SKU || '',
                descripcion: infoStock.descripción || infoStock.Descripción || infoStock.DESCRIPCION || '',
                piezas: infoStock.piezas || infoStock.Piezas || infoStock.PIEZAS || '',
                volumen: infoStock.volumen || infoStock.Volumen || infoStock.VOLUMEN || ''
            } : {};

            registrarCaptura(bodega, calle, lote, estadoInicial, datosExtra);
        }

        function registrarCaptura(bodega, calle, lote, estado, extra = {}) {
            emitirPitido();
            contadorActual++;
            
            if (!extra.sku) {
                let infoStock = datosStock.find(row => String(row.lote || row.Lote || row.LOTE) == lote);
                if (infoStock) {
                    extra = {
                        sku: infoStock.sku || infoStock.SKU || '',
                        descripcion: infoStock.descripción || infoStock.Descripción || infoStock.DESCRIPCION || '',
                        piezas: infoStock.piezas || infoStock.Piezas || infoStock.PIEZAS || '',
                        volumen: infoStock.volumen || infoStock.Volumen || infoStock.VOLUMEN || ''
                    };
                }
            }

            capturasCalleActual.push({
                bodega: bodega,
                calle: calle,
                lote: lote,
                sku: extra.sku || '',
                descripcion: extra.descripcion || '',
                piezas: extra.piezas || '',
                volumen: extra.volumen || '',
                estado_captura: estado,
                timestamp: new Date().toISOString()
            });
            actualizarProgresoVisual();
        }

        function mostrarModal(titulo, mensaje, callback) {
            document.getElementById('modalTitle').innerText = titulo;
            document.getElementById('modalMessage').innerText = mensaje;
            document.getElementById('alertModal').style.display = 'block';
            callbackModal = callback;
        }

        function resolverModal(confirmado) {
            document.getElementById('alertModal').style.display = 'none';
            if (callbackModal) {
                callbackModal(confirmado);
                callbackModal = null;
            }
        }

        function cerrarCalle() {
            let calle = document.getElementById('calleSelect').value;
            let meta = parseInt(document.getElementById('metaLotes').value) || 0;

            if (!calle) { 
                alert('No hay calle seleccionada.'); 
                return; 
            }

            if (contadorActual !== meta) {
                alert(`No se puede cerrar la calle. La cantidad de capturas (${contadorActual}) no coincide con la cantidad teorica esperada (${meta}).`);
                return;
            }

            let bodega = document.getElementById('bodegaSelect').value;
            capturasGlobales = capturasGlobales.filter(c => !(c.bodega == bodega && c.calle == calle));
            
            capturasGlobales = capturasGlobales.concat(capturasCalleActual);
            calleCerradaGuardada = true;
            actualizarBotonesAccion();
            
            alert(`Calle ${calle} cerrada y guardada correctamente con ${contadorActual} lotes.`);
        }

        function reabrirCalle() {
            let calle = document.getElementById('calleSelect').value;
            if (!calle) return;

            calleCerradaGuardada = false;
            actualizarBotonesAccion();
            alert(`Calle ${calle} reabierta para modificaciones de captura.`);
        }

        function descargarCSVGlobal() {
            if (capturasGlobales.length === 0) { alert('Sin capturas guardadas.'); return; }
            let csv = Papa.unparse(capturasGlobales);
            let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement("a");
            let url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "captura_tmt1_final.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
