<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVENTARIO PROCESO</title>
    <style>
        :root { --color-primary-main: #F57C00; --color-primary-dark: #E65100; --color-text-primary: #212121; --color-text-secondary: #757575; --color-bg-surface: #FFFFFF; --color-bg-dark: #424242; --color-border-subtle: #BCAAA4; --border-radius-md: 8px; --spacing-md: 24px; }
        body { font-family: 'Open Sans', sans-serif; background-color: #FAFAFA; color: var(--color-text-primary); margin: 0; padding: 16px; min-height: 100vh; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .nav-tab { flex: 1; padding: 12px; background: #eee; text-align: center; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .nav-tab.active { background: var(--color-primary-main); color: white; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        label { font-weight: 600; display: block; margin: 10px 0 5px; color: #555; text-transform: uppercase; font-size: 13px; }
        select, input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .progress { font-size: 24px; font-weight: bold; text-align: center; padding: 15px; background: #424242; color: white; border-radius: 8px; margin: 15px 0; }
        button { width: 100%; padding: 15px; background: var(--color-primary-main); color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; }
        .modal-content { background: white; margin: 20% auto; padding: 20px; width: 80%; border-radius: 8px; text-align: center; }
        .status-box { background: #dff0d8; padding: 10px; border-radius: 5px; text-align: center; color: #3c763d; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inventario Proceso</h1>
        <div class="nav-tabs">
            <div id="tabConfig" class="nav-tab" onclick="cambiarVista('config')">Configuración</div>
            <div id="tabCaptura" class="nav-tab active" onclick="cambiarVista('captura')">Captura</div>
        </div>

        <!-- CONFIGURACIÓN -->
        <div id="viewConfig" class="view-section">
            <label>Operarios (CSV):</label>
            <input type="file" id="fileOperarios" accept=".csv">
            <div id="statusOperarios" class="status-box" style="display:none;">Operarios cargados</div>
            
            <label>Seleccionar Operario:</label>
            <select id="operarioSelect" onchange="bloquearOperarioConfig()"><option value="">Seleccione...</option></select>
            
            <label>Stock (CSV):</label>
            <input type="file" id="fileStock" accept=".csv">
            <div id="statusStock" class="status-box" style="display:none;">Stock cargado</div>
            
            <label>Plano (CSV):</label>
            <input type="file" id="filePlano" accept=".csv">
            <div id="statusPlano" class="status-box" style="display:none;">Plano cargado</div>
            
            <button class="danger" onclick="reiniciarSistema()">Reiniciar Sistema</button>
        </div>

        <!-- CAPTURA -->
        <div id="viewCaptura" class="view-section active">
            <div id="infoOperarioActivo" style="padding:10px; background:#fff3e0; text-align:center; margin-bottom:10px;">Operario: No seleccionado</div>
            <label>Bodega:</label>
            <select id="bodegaSelect" onchange="actualizarCalles()"><option value="">Seleccione Bodega...</option></select>
            <label>Calle:</label>
            <select id="calleSelect" onchange="configurarCalle()"><option value="">Seleccione Calle...</option></select>
            <div class="progress" id="displayProgress">0 / 300</div>
            <input type="text" id="scannerInput" placeholder="Escanear Lote..." autofocus>
            <button onclick="abrirModalDetalle()">Ver Lotes Capturados</button>
        </div>
    </div>

    <div id="alertModal" class="modal"><div class="modal-content"><h3 id="modalTitle">Atención</h3><p id="modalMessage"></p><button onclick="resolverModal()">Aceptar</button></div></div>
    <div id="detalleModal" class="modal"><div class="modal-content"><h3 id="detalleTitle">Lotes</h3><div id="listaLotes"></div><button onclick="document.getElementById('detalleModal').style.display='none'">Cerrar</button></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script>
        const db = new Dexie("InventarioProcesoDB");
        db.version(1).stores({ capturas: "++id, operario, bodega, calle, lote, sku, timestamp" });

        let datosPlano = [], datosStock = [], datosOperarios = [], operarioActual = localStorage.getItem('inv_operario') || "", capturasCalleActual = [], contadorActual = 0, callbackModal = null;

        function cambiarVista(vista) {
            if (vista === 'config') {
                document.getElementById('viewConfig').classList.add('active');
                document.getElementById('viewCaptura').classList.remove('active');
                document.getElementById('tabConfig').classList.add('active');
                document.getElementById('tabCaptura').classList.remove('active');
            } else {
                if (!operarioActual) { alert("Seleccione un operario en Configuración primero."); return; }
                document.getElementById('viewConfig').classList.remove('active');
                document.getElementById('viewCaptura').classList.add('active');
                document.getElementById('tabConfig').classList.remove('active');
                document.getElementById('tabCaptura').classList.add('active');
            }
        }

        function emitirSonido(tipo) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'square';
                osc.frequency.setValueAtTime(tipo === 'error' ? 300 : 1200, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + (tipo === 'error' ? 0.5 : 0.15));
            } catch(e){}
        }

        document.getElementById('fileOperarios').addEventListener('change', e => {
            Papa.parse(e.target.files[0], { header: true, encoding: "ISO-8859-1", complete: res => {
                datosOperarios = res.data;
                let select = document.getElementById('operarioSelect');
                select.innerHTML = '<option value="">Seleccione...</option>';
                [...new Set(datosOperarios.map(r => r.operario || r.nombre))].forEach(n => { if(n) select.innerHTML += `<option value="${n}">${n}</option>`; });
                document.getElementById('statusOperarios').style.display = 'block';
            }});
        });

        document.getElementById('fileStock').addEventListener('change', e => Papa.parse(e.target.files[0], { header: true, encoding: "ISO-8859-1", complete: res => { datosStock = res.data; document.getElementById('statusStock').style.display = 'block'; } }));
        document.getElementById('filePlano').addEventListener('change', e => Papa.parse(e.target.files[0], { header: true, encoding: "ISO-8859-1", complete: res => { datosPlano = res.data; let s = document.getElementById('bodegaSelect'); [...new Set(res.data.map(r => r.bodega || r.Bodega))].forEach(b => { if(b) s.innerHTML += `<option value="${b}">${b}</option>`; }); document.getElementById('statusPlano').style.display = 'block'; } }));

        function bloquearOperarioConfig() { operarioActual = document.getElementById('operarioSelect').value; if(operarioActual) { document.getElementById('operarioSelect').disabled = true; document.getElementById('infoOperarioActivo').innerText = "Operario: " + operarioActual; localStorage.setItem('inv_operario', operarioActual); } }
        function actualizarCalles() { let b = document.getElementById('bodegaSelect').value, s = document.getElementById('calleSelect'); s.innerHTML = '<option value="">Seleccione...</option>'; datosPlano.filter(r => (r.bodega || r.Bodega) == b).forEach(r => { let c = r.calle || r.Calle; if(c) s.innerHTML += `<option value="${c}">${c}</option>`; }); }
        
        async function configurarCalle() {
            let b = document.getElementById('bodegaSelect').value, c = document.getElementById('calleSelect').value;
            capturasCalleActual = await db.capturas.where({bodega:b, calle:c}).toArray();
            contadorActual = capturasCalleActual.length;
            document.getElementById('displayProgress').innerText = contadorActual + " / 300";
        }

        document.getElementById('scannerInput').addEventListener('keypress', e => {
            if(e.key === 'Enter') { procesarLote(document.getElementById('scannerInput').value.trim()); document.getElementById('scannerInput').value = ''; }
        });

        async function procesarLote(lote) {
            let b = document.getElementById('bodegaSelect').value, c = document.getElementById('calleSelect').value;
            if(!b || !c) return alert("Seleccione Bodega y Calle");
            
            // Bloqueo estricto
            if(capturasCalleActual.find(x => x.lote == lote)) { emitirSonido('error'); mostrarModal("BLOQUEO", "Lote duplicado en esta calle."); return; }
            let dupe = await db.capturas.where('lote').equals(lote).and(x => x.calle != c).first();
            if(dupe) { emitirSonido('error'); mostrarModal("BLOQUEO", "Lote duplicado en otra calle ("+dupe.calle+")."); return; }
            
            // Registro
            emitirSonido('success');
            contadorActual++;
            await db.capturas.add({ operario: operarioActual, bodega: b, calle: c, lote: lote, timestamp: new Date().toISOString() });
            capturasCalleActual = await db.capturas.where({bodega:b, calle:c}).toArray();
            document.getElementById('displayProgress').innerText = contadorActual + " / 300";
        }

        function mostrarModal(t, m, fn) { document.getElementById('modalTitle').innerText = t; document.getElementById('modalMessage').innerText = m; document.getElementById('alertModal').style.display = 'block'; callbackModal = fn; }
        function resolverModal() { document.getElementById('alertModal').style.display = 'none'; if(callbackModal) callbackModal(); }
        function abrirModalDetalle() { document.getElementById('listaLotes').innerHTML = capturasCalleActual.map(x => x.lote).join(', '); document.getElementById('detalleModal').style.display = 'block'; }
        function reiniciarSistema() { if(confirm("¿Reiniciar?")) { db.capturas.clear().then(() => location.reload()); } }
    </script>
</body>
</html>
